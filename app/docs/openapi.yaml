openapi: 3.1.0
info:
  title: Alink User Management API
  version: 1.0.0
  description: |
    API for managing users with name, city, email, and phone capabilities. 
    Adheres to JSON:API standards.

servers:
  - url: 'http://{localHost}'
    description: Local server
    variables:
      localHost:
        default: 'localhost:8080'
  - url: 'https://{prodHost}'
    description: Production server
    variables:
      prodHost:
        default: alink.playonweb.org

paths:
  /api/v1/users:
    get:
      summary: List users
      operationId: getUsers
      description: Get all users or filter by city with pagination.
      parameters:
        - $ref: '#/components/parameters/CityFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated list of users
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
    
    post:
      summary: Create a user
      operationId: createUser
      description: Create a new user. ID and created_at are generated by the server.
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: The user ID
    
    get:
      summary: Get a specific user
      operationId: getUser
      description: |
        Retrieve details of a specific user. 
        By default, sensitive contact info is obfuscated. 
        Pass `reveal=true` to obtain plaintext contact data (subject to rate limiting).
      parameters:
        - name: reveal
          in: query
          description: If true, requests the plaintext (non-obfuscated) email and phone number.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: User details
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserResponse'

components:
  parameters:
    CityFilter:
      name: filter[city]
      in: query
      schema:
        type: string
      description: Filter users by city name
      example: 'Prague'
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
      description: Page number
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
      description: Items per page

  schemas:
    # -------------------------
    # Core Resource Schemas
    # -------------------------
    UserAttributes:
      type: object
      required:
        - name
        - email
        - city
      properties:
        name:
          type: string
          description: Full name of the user
          example: "John Doe"
        email:
          type: string
          format: email
          description: Unique email address
          example: "john.doe@example.com"
        city:
          type: string
          description: City of residence
          example: "New York"
        phone:
          type: [string, "null"]
          description: Contact phone number (optional)
          example: "+1-555-0123"
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp of record creation
          example: "2023-10-27T10:00:00Z"

    UserResource:
      type: object
      required:
        - type
        - id
        - attributes
      properties:
        type:
          type: string
          enum: [users]
          example: "users"
        id:
          type: integer
          description: The auto-incrementing primary key
          example: 123
        attributes:
          $ref: '#/components/schemas/UserAttributes'

    # -------------------------
    # Request Schemas
    # -------------------------
    UserCreateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum: [users]
              example: "users"
            attributes:
              type: object
              required:
                - name
                - email
                - city
              properties:
                name:
                  type: string
                  example: "Alice Smith"
                email:
                  type: string
                  format: email
                  example: "alice@example.com"
                city:
                  type: string
                  example: "London"
                phone:
                  type: string
                  nullable: true
                  example: "+44-20-7946-0958"

    # -------------------------
    # Response Schemas
    # -------------------------
    UserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UserResource'

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserResource'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginationMeta:
      type: object
      properties:
        count:
          type: integer
          description: Total number of records matching filter
          example: 150
        page:
          type: integer
          description: Current page number
          example: 1
        limit:
          type: integer
          description: Items per page
          example: 20
        prev_page:
          type: [integer, "null"]
          description: Previous page number
          example: null
        next_page:
          type: [integer, "null"]
          description: Next page number
          example: 2
        last_page:
          type: integer
          description: Last available page
          example: 8

    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
                example: "422"
              title:
                type: string
                example: "Invalid Attribute"
              detail:
                type: string
                example: "Email address is already in use."