name: Deploy Alink App

on:
  # push:
  #   branches: [ "main" ]
  #   paths:
  #     - 'k8s-deploy/apps/alink-app/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: .setup/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            rahuldhole/alink-app:latest
            rahuldhole/alink-app:${{ github.sha }}

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to k8s
        env:
          APP_DIR: .setup/k8s
          DB_PASS: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          # Helm Upgrade
          helm upgrade --install alink-app "$APP_DIR/chart" \
            --namespace alink-app --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set mysql.secret.rootPassword="$DB_PASS" \
            --wait --atomic
