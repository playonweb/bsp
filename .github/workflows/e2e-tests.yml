# WORKAROUND: Use Selenium IDE locally and import test-suit.side as a project to run them all.
name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  e2e-chrome:
    name: E2E Tests (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start application with Docker Compose
        run: |
          docker compose -f .setup/docker/docker-compose.yaml up -d --build
        env:
          COMPOSE_PROJECT_NAME: alink-e2e-test

      - name: Wait for application to be healthy
        run: |
          echo "Waiting for application to be ready..."
          timeout=120
          elapsed=0
          interval=2
          
          while [ $elapsed -lt $timeout ]; do
            if curl -f http://localhost:8080/healthz.php 2>/dev/null; then
              echo "✓ Application is healthy!"
              exit 0
            fi
            echo "Waiting... ($elapsed seconds elapsed)"
            sleep $interval
            elapsed=$((elapsed + interval))
          done
          
          echo "✗ Application failed to become healthy within ${timeout}s"
          docker compose -f .setup/docker/docker-compose.yaml logs app
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Selenium SIDE Runner and Reporters
        run: |
          npm install -g selenium-side-runner@4.0.0-alpha.38 jest-junit

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Verify ChromeDriver installation
        run: |
          chromedriver --version
          which chromedriver

      - name: Run E2E Tests
        run: |
          mkdir -p .test-results
          selenium-side-runner \
            --base-url http://localhost:8080 \
            --output-directory ./.test-results \
            --jest-options "--reporters=default --reporters=jest-junit" \
            --force \
            -c "browserName=chrome goog:chromeOptions.args=[headless, no-sandbox, disable-dev-shm-usage, window-size=1920,1080]" \
            tests/e2e/test-suite.side 2>&1 | tee e2e-chrome.log
        env:
          JEST_JUNIT_OUTPUT_DIR: "./.test-results"
          JEST_JUNIT_OUTPUT_NAME: "junit-chrome.xml"
        continue-on-error: true
        id: e2e_tests

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-.test-results-chrome
          path: |
            .test-results/
            *.log
          retention-days: 30

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '.test-results/*.xml'
          check_name: 'E2E Test Results (Chrome)'
          fail_on_failure: true
          detailed_summary: true
          include_passed: true

      - name: Capture application logs on failure
        if: failure()
        run: |
          echo "=== Application Logs ==="
          docker compose -f .setup/docker/docker-compose.yaml logs app
          echo "=== Database Logs ==="
          docker compose -f .setup/docker/docker-compose.yaml logs db

      - name: Cleanup
        if: always()
        run: |
          docker compose -f .setup/docker/docker-compose.yaml down -v

      - name: Fail job if tests failed
        if: steps.e2e_tests.outcome == 'failure'
        run: exit 1

  e2e-firefox:
    name: E2E Tests (Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start application with Docker Compose
        run: |
          docker compose -f .setup/docker/docker-compose.yaml up -d --build
        env:
          COMPOSE_PROJECT_NAME: alink-e2e-test-ff

      - name: Wait for application to be healthy
        run: |
          echo "Waiting for application to be ready..."
          timeout=120
          elapsed=0
          interval=2
          
          while [ $elapsed -lt $timeout ]; do
            if curl -f http://localhost:8080/healthz.php 2>/dev/null; then
              echo "✓ Application is healthy!"
              exit 0
            fi
            echo "Waiting... ($elapsed seconds elapsed)"
            sleep $interval
            elapsed=$((elapsed + interval))
          done
          
          echo "✗ Application failed to become healthy within ${timeout}s"
          docker compose -f .setup/docker/docker-compose.yaml logs app
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Selenium SIDE Runner, Geckodriver and Reporters
        run: |
          npm install -g selenium-side-runner@4.0.0-alpha.38 geckodriver jest-junit

      - name: Verify geckodriver installation
        run: |
          geckodriver --version
          which geckodriver

      - name: Run E2E Tests (Firefox)
        run: |
          mkdir -p .test-results
          selenium-side-runner \
            --base-url http://localhost:8080 \
            --output-directory ./.test-results \
            --jest-options "--reporters=default --reporters=jest-junit" \
            --force \
            -c "browserName=firefox moz:firefoxOptions.args=[-headless]" \
            tests/e2e/test-suite.side 2>&1 | tee e2e-firefox.log
        env:
          JEST_JUNIT_OUTPUT_DIR: "./.test-results"
          JEST_JUNIT_OUTPUT_NAME: "junit-firefox.xml"
        continue-on-error: true
        id: e2e_tests

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-.test-results-firefox
          path: |
            .test-results/
            *.log
          retention-days: 30

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '.test-results/*.xml'
          check_name: 'E2E Test Results (Firefox)'
          fail_on_failure: true
          detailed_summary: true
          include_passed: true

      - name: Capture application logs on failure
        if: failure()
        run: |
          echo "=== Application Logs ==="
          docker compose -f .setup/docker/docker-compose.yaml logs app
          echo "=== Database Logs ==="
          docker compose -f .setup/docker/docker-compose.yaml logs db

      - name: Cleanup
        if: always()
        run: |
          docker compose -f .setup/docker/docker-compose.yaml down -v

      - name: Fail job if tests failed
        if: steps.e2e_tests.outcome == 'failure'
        run: exit 1
