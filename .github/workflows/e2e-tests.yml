name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  statuses: write
  pull-requests: write

jobs:
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # To enable Firefox, just add 'firefox' to this list
        browser: [chrome]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Application
        run: |
          docker compose -f .setup/docker/docker-compose.yaml up -d --build
        env:
          COMPOSE_PROJECT_NAME: alink-e2e-${{ matrix.browser }}

      - name: Wait for Health
        run: |
          echo "Waiting for application..."
          # Loop for up to 60 seconds (reduced from 120 to fail earlier)
          timeout 60 bash -c 'until curl -s -f http://localhost:8080/healthz.php; do sleep 2; done' || (echo "Timeout reached" && exit 1)
          echo "✓ Application is healthy!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        # Explicitly install jest to ensure compatibility with jest-junit
        run: npm install selenium-side-runner@latest jest-junit jest

      # Setup Drivers based on matrix
      - name: Install ChromeDriver
        if: matrix.browser == 'chrome'
        uses: nanasess/setup-chromedriver@v2

      # Uncomment if you add 'firefox' to the matrix
      # - name: Install GeckoDriver
      #   if: matrix.browser == 'firefox'
      #   run: npm install geckodriver && npx geckodriver --version

      - name: Run Tests
        id: run_tests
        env:
          BROWSER: ${{ matrix.browser }}
          # Environment variables for jest-junit
          JEST_JUNIT_OUTPUT_DIR: "test-results"
          JEST_JUNIT_OUTPUT_NAME: "junit-${{ matrix.browser }}.xml"
        run: |
          mkdir -p test-results
          
          # Set Capabilities based on browser
          if [ "$BROWSER" == "chrome" ]; then
            CAPS="browserName=chrome goog:chromeOptions.args=[--headless,--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--window-size=1920,1080]"
          else
            CAPS="browserName=firefox moz:firefoxOptions.args=[--headless]"
          fi

          # Run Runner with explicit reporter arguments passed to Jest via '--'
          npx selenium-side-runner \
            --base-url http://localhost:8080 \
            --force \
            -c "$CAPS" \
            tests/e2e/test-suite.side \
            -- \
            --reporters=default \
            --reporters=jest-junit

        # We allow this to pass temporarily so we can check for artifacts, 
        # but the next step ensures we fail if no report exists.
        continue-on-error: true

      - name: Verify Results (Fail Early)
        run: |
          if [ ! -f "test-results/junit-${{ matrix.browser }}.xml" ]; then
            echo "::error::❌ No JUnit XML report found! Tests likely crashed or configuration failed."
            ls -R test-results || echo "Folder empty"
            exit 1
          fi
          echo "✅ Test report found."

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 14

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'test-results/*.xml'
          check_name: 'E2E Results (${{ matrix.browser }})'
          fail_on_failure: true
          require_tests: true
          detailed_summary: true
          include_passed: true

      - name: Dump Logs on Failure
        if: failure() || steps.run_tests.outcome == 'failure'
        run: |
          docker compose -f .setup/docker/docker-compose.yaml logs --tail=100

      - name: Cleanup
        if: always()
        run: docker compose -f .setup/docker/docker-compose.yaml down -v

      - name: Check Final Status
        if: steps.run_tests.outcome == 'failure'
        run: exit 1