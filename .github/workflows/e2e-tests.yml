name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  statuses: write
  checks: write
  contents: write
  pull-requests: write
  actions: write

jobs:
  e2e-chrome:
    name: E2E Tests (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start application with Docker Compose
        run: |
          docker compose -f .setup/docker/docker-compose.yaml up -d --build
        env:
          COMPOSE_PROJECT_NAME: alink-e2e-test

      - name: Wait for application to be healthy
        run: |
          echo "Waiting for application to be ready..."
          timeout=120
          elapsed=0
          interval=2
          
          while [ $elapsed -lt $timeout ]; do
            if curl -f http://localhost:8080/healthz.php 2>/dev/null; then
              echo "✓ Application is healthy!"
              exit 0
            fi
            echo "Waiting... ($elapsed seconds elapsed)"
            sleep $interval
            elapsed=$((elapsed + interval))
          done
          
          echo "✗ Application failed to become healthy within ${timeout}s"
          docker compose -f .setup/docker/docker-compose.yaml logs app
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Selenium SIDE Runner and Reporters
        # Install locally to ensure dependencies are resolved correctly by npx
        run: |
          npm install selenium-side-runner@latest jest-junit

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Verify ChromeDriver installation
        run: |
          chromedriver --version
          which chromedriver

      - name: Run E2E Tests
        id: e2e_tests
        # Use npx for local execution
        # Create jest.config.js to handle reporters and avoid CLI parsing errors with dashes
        # Added double dashes (--) to chrome arguments (Critical for headless mode)
        # Use absolute path for output directory
        run: |
          echo "module.exports = { reporters: ['default', 'jest-junit'] };" > jest.config.js
          mkdir -p ${{ github.workspace }}/.test-results
          npx selenium-side-runner \
            --base-url http://localhost:8080 \
            --output-directory "${{ github.workspace }}/.test-results" \
            --force \
            -c "browserName=chrome goog:chromeOptions.args=[--headless,--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--window-size=1920,1080]" \
            tests/e2e/test-suite.side
        env:
          JEST_JUNIT_OUTPUT_DIR: "${{ github.workspace }}/.test-results"
          JEST_JUNIT_OUTPUT_NAME: "junit-chrome.xml"
        continue-on-error: true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-.test-results-chrome
          path: |
            ${{ github.workspace }}/.test-results/
          retention-days: 30

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '${{ github.workspace }}/.test-results/*.xml'
          check_name: 'E2E Test Results (Chrome)'
          fail_on_failure: true
          detailed_summary: true
          include_passed: true

      - name: Capture application logs on failure
        if: failure() || steps.e2e_tests.outcome == 'failure'
        run: |
          echo "=== Application Logs ==="
          docker compose -f .setup/docker/docker-compose.yaml logs app
          echo "=== Database Logs ==="
          docker compose -f .setup/docker/docker-compose.yaml logs db

      - name: Cleanup
        if: always()
        run: |
          docker compose -f .setup/docker/docker-compose.yaml down -v

      - name: Fail job if tests failed
        if: steps.e2e_tests.outcome == 'failure'
        run: exit 1

