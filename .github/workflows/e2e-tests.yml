name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  statuses: write
  pull-requests: write

jobs:
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # To enable Firefox, just add 'firefox' to this list
        browser: [chrome]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Application
        run: |
          docker compose -f .setup/docker/docker-compose.yaml up -d --build
        env:
          COMPOSE_PROJECT_NAME: alink-e2e-${{ matrix.browser }}

      - name: Wait for Health
        run: |
          echo "Waiting for application..."
          # Loop for up to 120 seconds checking the endpoint
          timeout 120 bash -c 'until curl -s -f http://localhost:8080/healthz.php; do sleep 2; done' || (echo "Timeout reached" && exit 1)
          echo "✓ Application is healthy!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install selenium-side-runner@latest jest-junit

      # Setup Drivers based on matrix
      - name: Install ChromeDriver
        if: matrix.browser == 'chrome'
        uses: nanasess/setup-chromedriver@v2

      # Uncomment if you add 'firefox' to the matrix
      # - name: Install GeckoDriver
      #   if: matrix.browser == 'firefox'
      #   run: npm install geckodriver && npx geckodriver --version

      - name: Run Tests
        id: run_tests
        env:
          BROWSER: ${{ matrix.browser }}
          # These env vars help jest-junit if config fails
          JEST_JUNIT_OUTPUT_DIR: "test-results"
          JEST_JUNIT_OUTPUT_NAME: "junit-${{ matrix.browser }}.xml"
        run: |
          mkdir -p test-results
          
          # 1. Generate Jest Config explicitly to force the reporter
          # We use the matrix browser name to create unique report files
          cat <<EOF > jest.config.js
          module.exports = {
            reporters: [
              'default',
              ['jest-junit', { 
                outputDirectory: 'test-results', 
                outputName: 'junit-${{ matrix.browser }}.xml',
                uniqueOutputName: false 
              }]
            ]
          };
          EOF

          # 2. Set Capabilities based on browser
          if [ "$BROWSER" == "chrome" ]; then
            CAPS="browserName=chrome goog:chromeOptions.args=[--headless,--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--window-size=1920,1080]"
          else
            CAPS="browserName=firefox moz:firefoxOptions.args=[--headless]"
          fi

          # 3. Run Runner
          # We don't use --output-directory for the runner itself to avoid conflict with jest-junit
          npx selenium-side-runner \
            --base-url http://localhost:8080 \
            --force \
            -c "$CAPS" \
            tests/e2e/test-suite.side

        # Allow step to "pass" so we can upload reports, but mark job as failed later if needed
        continue-on-error: true

      - name: Debug Output
        if: always()
        run: |
          echo "Listing test results folder:"
          ls -R test-results || echo "Folder not found!"

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 14

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'test-results/*.xml'
          check_name: 'E2E Results (${{ matrix.browser }})'
          fail_on_failure: true     # Fail the build if tests failed
          require_tests: true       # Fail if no xml is found
          detailed_summary: true    # Shows a table in the Workflow Summary
          include_passed: true

      - name: Dump Logs on Failure
        if: failure() || steps.run_tests.outcome == 'failure'
        run: |
          docker compose -f .setup/docker/docker-compose.yaml logs --tail=100

      - name: Cleanup
        if: always()
        run: docker compose -f .setup/docker/docker-compose.yaml down -v

      # Explicitly fail the job if the test runner failed (since we used continue-on-error)
      - name: Check Final Status
        if: steps.run_tests.outcome == 'failure'
        run: exit 1