name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox] # [chrome, firefox]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Application
        run: |
          docker compose -f .setup/docker/docker-compose.yaml up -d --build
        env:
          COMPOSE_PROJECT_NAME: alink-e2e-${{ matrix.browser }}

      - name: Wait for Health
        run: |
          echo "Waiting for application..."
          # Poll the health endpoint for up to 60 seconds
          timeout 60 bash -c 'until curl -s -f http://localhost:8080/healthz.php; do sleep 2; done' || (echo "Timeout reached" && exit 1)
          echo "✓ Application is healthy!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install selenium-side-runner@latest

      - name: Install ChromeDriver
        if: matrix.browser == 'chrome'
        uses: nanasess/setup-chromedriver@v2

      - name: Install GeckoDriver
        if: matrix.browser == 'firefox'
        run: npm install geckodriver && npx geckodriver --version

      - name: Run Tests
        id: run_tests
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          # Define capabilities for Headless execution
          # --no-sandbox & --disable-dev-shm-usage are critical for Docker/CI stability
          if [ "$BROWSER" == "chrome" ]; then
            CAPS="browserName=chrome goog:chromeOptions.args=[--headless,--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--window-size=1920,1080]"
          else
            CAPS="browserName=firefox moz:firefoxOptions.args=[--headless]"
          fi

          echo "Starting Selenium Side Runner..."
          
          # Run tests directly. 
          # --timeout 15000: Increase step timeout to 15s to prevent flakes on slow CI runners
          npx selenium-side-runner \
            --base-url http://localhost:8080 \
            -c "$CAPS" \
            --timeout 15000 \
            tests/e2e/test-suite.side

      - name: Dump Logs on Failure
        if: failure()
        run: |
          echo "=== Application Logs ==="
          docker compose -f .setup/docker/docker-compose.yaml logs --tail=100

      - name: Cleanup
        if: always()
        run: docker compose -f .setup/docker/docker-compose.yaml down -v