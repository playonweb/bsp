name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox] # [chrome, firefox]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Application
        run: |
          docker compose -f .setup/docker/docker-compose.yaml up -d --build
        env:
          COMPOSE_PROJECT_NAME: alink-e2e-${{ matrix.browser }}

      - name: Wait for Health
        run: |
          echo "Waiting for application..."
          # Poll the health endpoint for up to 60 seconds
          timeout 60 bash -c 'until curl -s -f http://localhost:8080/healthz.php; do sleep 2; done' || (echo "Timeout reached" && exit 1)
          echo "✓ Application is healthy!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install selenium-side-runner@latest

      - name: Install ChromeDriver
        if: matrix.browser == 'chrome'
        uses: nanasess/setup-chromedriver@v2

      - name: Install GeckoDriver
        if: matrix.browser == 'firefox'
        run: npm install geckodriver && npx geckodriver --version

      - name: Run Tests
        id: run_tests
        continue-on-error: true
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          # Define capabilities for Headless execution
          if [ "$BROWSER" == "chrome" ]; then
            CAPS="browserName=chrome goog:chromeOptions.args=[--headless,--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--window-size=1920,1080]"
          else
            CAPS="browserName=firefox moz:firefoxOptions.args=[--headless]"
          fi

          echo "Starting Selenium Side Runner..."
          mkdir -p .test-results
          
          # Run tests with output directory
          npx selenium-side-runner \
            -c "$CAPS" \
            --timeout 15000 \
            -o .test-results \
            tests/e2e/test-suite.side

      - name: Dump Application Logs
        if: always()
        run: |
          docker compose -f .setup/docker/docker-compose.yaml logs --tail=200 > app-logs-${{ matrix.browser }}.log

      - name: Generate and Post Report
        if: always()
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          # Find the latest JSON file in .test-results
          REPORT_FILE=$(ls -t .test-results/*.json 2>/dev/null | head -n 1)
          if [ -f "$REPORT_FILE" ]; then
            node .github/scripts/ci-report.js "$REPORT_FILE" "app-logs-${{ matrix.browser }}.log"
          else
            echo "::warning::No test results found to report."
            # If no report but tests were supposed to run, this might be a runtime crash
            if [ "${{ steps.run_tests.outcome }}" == "failure" ]; then
              exit 1
            fi
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.browser }}
          path: |
            .test-results/*.json
            app-logs-${{ matrix.browser }}.log
            report-${{ matrix.browser }}.md
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose -f .setup/docker/docker-compose.yaml down -v