version: '3'

vars:
  COMPOSE_FILE: .setup/docker/docker-compose.yaml
  ENV_FILE: .env
  TEST_SUITE: tests/e2e/test-suite.side

tasks:
  sync:secrets:
    desc: Sync secrets from GitHub to .env file
    cmds:
      - .github/scripts/sync-secrets.sh

  deploy:
    desc: Deploy the application
    cmds:
      - gh workflow run "Deploy Alink App"

  up:
    desc: Start the development environment
    cmds:
      - |
        if [ -f {{.ENV_FILE}} ]; then
          docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} up -d --build
        else
          docker compose -f {{.COMPOSE_FILE}} up -d --build
        fi

  down:
    desc: Stop and clean up the development environment
    cmds:
      - |
        if [ -f {{.ENV_FILE}} ]; then
          docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} down -v
        else
          docker compose -f {{.COMPOSE_FILE}} down -v
        fi

  logs:
    desc: View application logs
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f app

  console:
    desc: Access the application console
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec app bash

  db:
    desc: Access the database shell
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec db mysql -u root -p"$DB_PASS" "$DB_NAME"

  reset:
    desc: Reset the database and restart services
    cmds:
      - task: down
      - task: up

  test:
    desc: Run E2E Tests on chrome & firefox
    cmds:
      - task: test:chrome:headless
      - task: test:firefox:headless

  test:chrome:
    desc: Run E2E tests locally (Chrome - requires matching ChromeDriver binary (https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json) and `npm install -g chromedriver@<version>`)
    cmds:
      - selenium-side-runner --base-url http://localhost:8080 -c "browserName=chrome" {{.TEST_SUITE}}

  test:chrome:headless:
    desc: Run E2E tests in headless mode (Chrome)
    cmds:
      - selenium-side-runner --base-url http://localhost:8080 -c "browserName=chrome goog:chromeOptions.args=[disable-infobars, headless]" {{.TEST_SUITE}}

  test:firefox:
    desc: Run E2E tests locally (Firefox)
    cmds:
      - selenium-side-runner --base-url http://localhost:8080 -c "browserName=firefox" {{.TEST_SUITE}}

  test:firefox:headless:
    desc: Run E2E tests in headless mode (Firefox)
    cmds:
      - selenium-side-runner --base-url http://localhost:8080 -c "browserName=firefox moz:firefoxOptions.args=[-headless]" {{.TEST_SUITE}}

  default:
    desc: Show available tasks
    cmds:
      - task --list