version: '3'

vars:
  COMPOSE_FILE: .setup/docker/docker-compose.yaml
  ENV_FILE: .env

tasks:
  rebuild: # no cache
    desc: Build the application
    cmds:
      - |
        if [ -f {{.ENV_FILE}} ]; then
          docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} build --no-cache
        else
          docker compose -f {{.COMPOSE_FILE}} build
        fi
  up:
    desc: Start the development environment
    cmds:
      - |
        if [ -f {{.ENV_FILE}} ]; then
          docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} up -d --build
        else
          docker compose -f {{.COMPOSE_FILE}} up -d --build
        fi

  down:
    desc: Stop and clean up the development environment
    cmds:
      - |
        if [ -f {{.ENV_FILE}} ]; then
          docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} down -v
        else
          docker compose -f {{.COMPOSE_FILE}} down -v
        fi

  logs:
    desc: View application logs
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f app

  console:
    desc: Access the application console
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec app bash

  db:
    desc: Access the database shell
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec db mysql -u root -p"$DB_PASS" "$DB_NAME"

  reset:
    desc: Reset the database and restart services
    cmds:
      - task: down
      - task: up

  default:
    desc: Show available tasks
    cmds:
      - task --list