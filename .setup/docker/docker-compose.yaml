services:
  app:
    build:
      context: ../../
      dockerfile: .setup/docker/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ../../app:/var/www/html
    depends_on:
      - db
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost:8080}
      DB_HOST: ${DB_HOST:-db}
      DB_USER: ${DB_USER:-root}
      DB_NAME: ${DB_NAME:-php_test}
      DB_PASS: ${DB_PASS:-root}

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-php_test}
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ../../app/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  db_data: