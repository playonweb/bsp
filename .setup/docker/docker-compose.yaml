networks:
  betterstack-php:
    name: betterstack-php
volumes:
  db_data:
  powertools-home:

services:
  app:
    build:
      context: ../../
      dockerfile: .setup/docker/Dockerfile
      args:
        BASE_STAGE: ${BASE_STAGE:-base}
      tags: 
        - betterstack/php-app:${BASE_STAGE:-base}
    tty: true
    mem_limit: 2048m
    cpus: '1'
    ports:
      - "8080:80"
    volumes:
      - ../../app:/var/www/html
      - powertools-home:/home/www-data:rw
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - betterstack-php
    depends_on:
      - db
    environment:
      PHP_ENV: ${PHP_ENV:-development}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost:8080}
      DB_HOST: ${DB_HOST:-db}
      DB_USER: ${DB_USER:-root}
      DB_NAME: ${DB_NAME:-php_test}
      DB_PASS: ${DB_PASS:-root}

  db:
    image: mysql:8.0
    mem_limit: 2048m
    cpus: '1'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-php_test}
      TZ: UTC
    networks:
      - betterstack-php
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ../../app/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command: --default-authentication-plugin=mysql_native_password
