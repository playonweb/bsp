apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "standard-app.fullname" . }}-policy
  labels:
    {{- include "standard-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "standard-app.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - port: {{ .Values.service.targetPort }}
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  {{- if .Values.mysql.enabled }}
  - to:
    - podSelector:
        matchLabels:
          app: {{ include "standard-app.fullname" . }}-mysql
    ports:
    - port: 3306
  {{- end }}

{{- if .Values.mysql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "standard-app.fullname" . }}-mysql-policy
  labels:
    {{- include "standard-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "standard-app.fullname" . }}-mysql
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "standard-app.selectorLabels" . | nindent 10 }}
    ports:
    - port: 3306
{{- end }}
