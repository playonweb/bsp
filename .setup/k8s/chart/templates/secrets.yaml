{{- if .Values.mysql.enabled -}}
{{- if .Values.mysql.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mysql.secret.name }}
  labels:
    {{- include "standard-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-password: {{ .Values.mysql.secret.rootPassword | quote }}
{{- end }}
{{- end }}
