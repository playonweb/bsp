apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "standard-app.fullname" . }}
  labels:
    {{- include "standard-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "standard-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "standard-app.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "standard-app.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
          - name: ALLOWED_HOSTS
            value: {{ .Values.allowedHosts | quote }}
          {{- if .Values.mysql.enabled }}
          - name: DB_HOST
            value: "{{ include "standard-app.fullname" . }}-mysql"
          - name: DB_NAME
            value: {{ .Values.mysql.dbName | quote }}
          - name: DB_USER
            value: {{ .Values.mysql.dbUser | quote }}
          - name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: {{ .Values.mysql.secret.name }}
                key: root-password
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
